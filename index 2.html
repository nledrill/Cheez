<style>

</style></head><body>
<div id="splash"></div>
<div id="app"><header><div class="logo" id="lg"></div><div style="display:flex;align-items:center"><div class="pill">⭐ <span id="bal"></span></div><button class="plus" onclick="freeMoney()">+</button></div></header>
<div id="main"></div>
<nav><button onclick="menu()"><span>☰</span>Меню</button><button data-v="home" onclick="go('home')"><span>🏠</span>Главная</button><button data-v="casino" onclick="go('casino')"><span>♠️</span>Казино</button><button data-v="sport" onclick="go('sport')"><span>⚽</span>Спорт</button><button data-v="chat" onclick="go('chat')"><span>💬</span>Чат</button></nav></div>
<div id="game"></div><div id="drawer"></div><div id="sheet"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>Math.floor(n).toLocaleString("ru"),rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={bal:1000,wag:0,daily:0,wel:0,bet:50};
try{Object.assign(S,JSON.parse(localStorage.getItem("cheez")||"{}"))}catch(e){}
const tg=window.Telegram&&window.Telegram.WebApp;let NAME="Игрок";
try{tg.ready();tg.expand();NAME=tg.initDataUnsafe.user.first_name||NAME}catch(e){}
const save=()=>{try{localStorage.setItem("cheez",JSON.stringify(S))}catch(e){}};
const hap=()=>{try{tg.HapticFeedback.impactOccurred("light")}catch(e){}};
function upd(){$("#bal").textContent=fmt(S.bal);const g=$("#gbal");if(g)g.textContent=fmt(S.bal);save()}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}
const logo=h=>`<svg width="34" height="30" viewBox="0 0 64 56"><path d="M4 22C20 10 36 6 46 4l14 18 2 4v22c0 3-2 4-4 4L8 44c-3-1-4-2-4-4z" fill="#fff"/><g fill="${h}"><circle cx="24" cy="34" r="5"/><circle cx="44" cy="30" r="6"/><circle cx="32" cy="18" r="3.5"/><circle cx="14" cy="31" r="3"/><circle cx="52" cy="42" r="3"/></g></svg>`;
$("#lg").innerHTML=logo("#0e0f12")+"cheez";$("#splash").innerHTML=`<div style="transform:scale(2.4);margin-bottom:30px">${logo("#0039b3")}</div>cheez`;
setTimeout(()=>{$("#splash").style.opacity=0;setTimeout(()=>$("#splash").remove(),500)},900);
/* ---- каталог ---- */
const SY={s1:["🍒","🍋","🍇","🍭","🧀","7️⃣"],s2:["🪙","🏺","🍷","💎","⚡","👑"],s3:["🌵","🐴","💰","🔫","⭐","🤠"],s4:["🦴","🪲","🏺","💀","🧿","🧟"]};
const G=[
{id:"jet",n:"Cheese Jet",p:"CHEEZ GAMES",e:"🚀",g:"#7b3cff,#4a1fb8",t:"crash",k:"own",f:1},
{id:"mouse",n:"Rocket Mouse",p:"CHEEZ GAMES",e:"🐭",g:"#d83cff,#ff5fa8",t:"crash",k:"own",f:1},
{id:"bj",n:"Blackjack",p:"CHEEZ GAMES",e:"🃏",g:"#0a3cb5,#0a6cff",t:"bj",k:"own"},
{id:"mines",n:"Cheese Mines",p:"CHEEZ GAMES",e:"💣",g:"#0f8f5a,#0a4d36",t:"mines",k:"own",f:1},
{id:"s1",n:"Sweet Cheese 2500",p:"SWEET LAB",e:"🍭",g:"#2a8cff,#ff9a3d",t:"slot",k:"slot",pop:1,sy:SY.s1},
{id:"s2",n:"Gates of Gouda",p:"OLYMP PLAY",e:"⚡",g:"#e8731a,#7a1a0a",t:"slot",k:"slot",pop:1,sy:SY.s2},
{id:"s3",n:"Wild Mouse Showdown",p:"WEST SOFT",e:"🤠",g:"#8a2be2,#e8731a",t:"slot",k:"slot",pop:1,sy:SY.s3},
{id:"s4",n:"Mummyland Cheese",p:"SAND GAMING",e:"🧟",g:"#6a1a0a,#a02be2",t:"slot",k:"slot",pop:1,sy:SY.s4},
{id:"rl",n:"Roulette",p:"LIVE STUDIO",e:"🎡",g:"#3a1a0a,#a8521a",t:"rl",k:"live"},
{id:"rbj",n:"Russian Blackjack",p:"LIVE STUDIO",e:"👩‍💼",g:"#0a1a5a,#2a6acc",t:"bj",k:"live"},
{id:"wheel",n:"Cheese Wheel",p:"LIVE STUDIO",e:"🎰",g:"#1a8cff,#bfe5ff",t:"wheel",k:"live",f:1}];
const cnt=id=>(id.split("").reduce((a,c)=>a+c.charCodeAt(0),0)*37)%400+20;
const gc=g=>`<div class="gc"><div class="card" onclick="openGame('${g.id}')" style="background:linear-gradient(160deg,${g.g})"><i>${g.p}</i><b>${g.n}</b><span class="em">${g.e}</span></div><div class="ol"><s></s>${cnt(g.id)} играют</div></div>`;
const sec=(t,ic,l,key)=>`<div class="sh"><span>${ic} ${t} <u onclick="go('casino',{chip:'${key}'})">›</u></span><span><button onclick="sc(this,-1)">‹</button><button onclick="sc(this,1)">›</button></span></div><div class="row">${l.map(gc).join("")}</div>`;
function sc(b,d){b.closest(".sh").nextElementSibling.scrollBy({left:d*240,behavior:"smooth"})}
/* ---- навигация ---- */
let timers=[],view="home";const V={},I={};
const every=(f,ms)=>timers.push(setInterval(f,ms));
function go(v,o){timers.forEach(clearInterval);timers=[];view=v;document.querySelectorAll("nav button[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v==v));$("#main").innerHTML=V[v](o||{});$("#main").scrollTop=0;I[v]&&I[v]()}
const BN=[["WELCOME BONUS","600%","linear-gradient(120deg,#16171c,#454955)"],["Джекпот 100 000 ⭐","каждый месяц","linear-gradient(120deg,#0a1230,#2a4aa0)"],["Free money","⭐ 500 каждый день","linear-gradient(120deg,#0c3b24,#2a8f5a)"]];
const banner=()=>`<div class="ban" id="ban" onclick="bonusSheet()"><div><b id="b1"></b><em id="b2"></em></div><div class="dots" id="dots"></div></div>`;
function initBan(){const b=$("#ban");if(!b)return;let i=0;const f=()=>{const s=BN[i%3];b.style.background=s[2];$("#b1").textContent=s[0];$("#b2").textContent=s[1];$("#dots").innerHTML=BN.map((_,j)=>`<i class="${j==i%3?"on":""}"></i>`).join("");i++};f();every(3500,f)}
I.home=initBan;
const foot=`<div class="foot">Игровые звёзды ⭐ не имеют реальной стоимости. Развлекательное приложение, 18+</div>`;
V.home=()=>banner()+sec("cheez games","🧀",G.filter(g=>g.k=="own"),"own")+sec("Все игры","▦",G.filter(g=>g.k!="live"),"all")+sec("Популярные","✦",G.filter(g=>g.pop),"pop")+sec("Live казино","♠️",G.filter(g=>g.k=="live"),"live")+foot;
/* ---- казино ---- */
let CS={tab:"lobby",q:"",prov:"",chip:"all"};
const CHIPS=[["all","Лобби"],["own","cheez games"],["pop","Популярные"],["slot","Слоты"],["live","Live казино"]];
function list(){return G.filter(g=>(CS.tab=="live"?g.k=="live":CS.tab=="fast"?g.f:1)&&(!CS.q||g.n.toLowerCase().includes(CS.q.toLowerCase()))&&(!CS.prov||g.p==CS.prov)&&(CS.tab!="lobby"||CS.chip=="all"||(CS.chip=="pop"?g.pop:g.k==CS.chip)))}
function resHtml(){const filt=CS.q||CS.prov||CS.chip!="all"||CS.tab!="lobby";if(!filt)return V.home().replace(banner(),"");const l=list();return l.length?`<div class="grid">${l.map(gc).join("")}</div>`:`<p style="color:#8d909a;text-align:center;margin-top:30px">Ничего не найдено. Сбросьте поиск или провайдера.</p>`}
V.casino=o=>{if(o.chip){CS.chip=o.chip;CS.tab="lobby";CS.q="";CS.prov=""}
return `<div class="tabs">${[["lobby","Лобби"],["live","Live казино"],["fast","Быстрые игры"]].map(t=>`<button class="${CS.tab==t[0]?"on":""}" onclick="CS.tab='${t[0]}';CS.chip='all';go('casino')">${t[1]}</button>`).join("")}</div>${CS.tab=="lobby"?banner()+`<div class="srow"><input placeholder="Поиск" value="${esc(CS.q)}" oninput="CS.q=this.value;$('#res').innerHTML=resHtml()"><button onclick="provSheet()">▦ ${CS.prov||"Провайдеры"}</button></div><div class="chips">${CHIPS.map(c=>`<button class="${CS.chip==c[0]?"on":""}" onclick="CS.chip='${c[0]}';go('casino')">${c[1]}</button>`).join("")}</div>`:""}<div id="res">${resHtml()}</div>`};
I.casino=initBan;
function provSheet(){const P=[...new Set(G.map(g=>g.p))];sheet(`<h3>Провайдеры</h3><div class="outs"><button onclick="CS.prov='';closeSheet();go('casino')">Все</button>${P.map(p=>`<button onclick="CS.prov='${p}';closeSheet();go('casino')">${p}</button>`).join("")}</div>`)}
/* ---- игры: общее ---- */
const GAMES={};let cur=null;
function openGame(id){const g=G.find(x=>x.id==id);$("#game").innerHTML=`<div class="gh"><button onclick="closeGame()">‹</button><b>${g.n}</b><span class="pill">⭐ <span id="gbal"></span></span></div><div class="gb" id="gb"></div>`;$("#game").classList.add("on");upd();cur=GAMES[g.t](g,$("#gb"))||null}
function closeGame(){if(cur&&cur.stop)cur.stop();cur=null;$("#game").classList.remove("on");upd()}
const betUI=()=>`<div class="bet"><button data-a="half">½</button><input id="bet" type="number" inputmode="numeric" value="${S.bet}" oninput="S.bet=+this.value"><button data-a="x2">×2</button><button data-a="max">MAX</button></div>`;
function betBtn(e){const a=e.target.dataset.a,i=$("#bet");if(!i)return 0;if(a=="half")i.value=Math.max(10,Math.floor(i.value/2));else if(a=="x2")i.value=Math.min(Math.max(S.bal,10),Math.floor(i.value*2));else if(a=="max")i.value=Math.max(10,Math.floor(S.bal));else return 0;S.bet=+i.value;return 1}
function take(){const i=$("#bet"),b=Math.floor(+(i&&i.value));if(!(b>=10))return toast("Минимум 10 ⭐"),0;if(b>S.bal)return toast("Не хватает звёзд. Забери бонус в меню"),0;S.bet=b;S.bal-=b;S.wag+=b;upd();hap();return b}
